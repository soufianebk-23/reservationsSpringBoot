spring.application.name=reservations-springboot
spring.application.frontend-url=http://localhost:8080

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://localhost:3306/reservations?autoReconnect=true&useSSL=false&serverTimezone=Europe/Brussels
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.baseline-on-migrate=true

spring.mvc.hiddenmethod.filter.enabled=true

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true