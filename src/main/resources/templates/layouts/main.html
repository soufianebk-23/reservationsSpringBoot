<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Projet Réservations</title>
    <th:block layout:fragment="css"></th:block>
	<style>
	    .alert { padding: 8px 12px; margin: 10px 0; border-radius: 4px; }
	    .alert p { margin: 0; }
	    .alert-success { background: #d4edda; color: #155724; }
	    .alert-danger { background: #f8d7da; color: #721c24; }
	</style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}">Header here</div>
    <div class="container">
        <div id="notification">
            <div th:if="${successMessage}" class="alert alert-success">
                <p th:text="${successMessage}"></p>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger">
                <p th:text="${errorMessage}"></p>
            </div>
        </div>
        <div layout:fragment="content">Main content will be inserted here.</div>
    </div>
    <div th:replace="~{fragments/footer :: footer}">Footer here</div>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
